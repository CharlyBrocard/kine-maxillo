# À copier dans /etc/nginx/sites-available/kine-maxillo-lyon.com puis lier
# dans sites-enabled. Version HTTP : `certbot --nginx` ajoute ensuite le
# HTTPS et la redirection 80 → 443 (voir README "Déploiement").

# www → domaine canonique (siteConfig.url, sans www)
server {
    listen 80;
    server_name www.kine-maxillo-lyon.com;
    return 301 https://kine-maxillo-lyon.com$request_uri;
}

server {
    listen 80;
    server_name kine-maxillo-lyon.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP du client : remplace toute valeur envoyée par le client (lue
        # par la limitation de débit, voir src/lib/rate-limit.ts).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
