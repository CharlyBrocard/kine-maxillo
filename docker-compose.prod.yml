# Production (VPS) — voir README "Déploiement". Lancé avec :
#   docker compose -f docker-compose.prod.yml up -d --build
# Variables lues dans le fichier .env à côté de ce fichier (jamais commité,
# modèle : deploy/env.production.example).
name: kine-maxillo

# Journaux techniques bornés (rotation, ~30 Mo max par service) : sans ça,
# les logs Docker grossissent indéfiniment (voir /confidentialite).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    # Aucun port publié : la base n'est joignable que par les services de
    # ce fichier, via le réseau Docker interne.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applique les migrations Prisma puis s'arrête ; l'app attend sa réussite.
  migrate:
    build:
      context: .
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    logging: *logging
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    ports:
      # Localhost uniquement : Nginx (sur l'hôte) fait le reverse proxy.
      # 3000 est déjà pris sur le VPS.
      - "127.0.0.1:3001:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
